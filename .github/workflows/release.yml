name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    name: Terbitkan rilis
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pastikan tag berada di main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG harus menunjuk commit yang sudah ada di main."
            exit 1
          fi

      - name: Pastikan versi package.json sama dengan tag
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::package.json berisi $VERSION, tetapi tag-nya $TAG."
            exit 1
          fi

      - name: Pasang dependensi
        run: npm ci

      - name: Jalankan tes
        run: npm test

      - name: Periksa tipe dan build
        run: npm run build

      - name: Kemas hasil build
        run: cd dist && zip -r "../pos-tenan-mall-$TAG.zip" .

      - name: Buat GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "pos-tenan-mall-$TAG.zip" --title "$TAG" --generate-notes --verify-tag

      - name: Simpan hasil build untuk deploy
        uses: actions/upload-artifact@v4
        with:
          name: pos-release-${{ github.ref_name }}
          path: dist
          retention-days: 14
          if-no-files-found: error

  # Job terpisah agar deploy yang gagal bisa diulang tanpa membuat rilis dua kali,
  # dan panel Deployments hanya mencatat deploy yang benar-benar berjalan.
  deploy-production:
    name: Deploy produksi
    needs: release
    # Sengaja dikunci sampai domain final terpasang.
    if: vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://pos-tenan-mall.pages.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Ambil hasil build
        uses: actions/download-artifact@v4
        with:
          name: pos-release-${{ github.ref_name }}
          path: dist

      - name: Kirim ke Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=pos-tenan-mall --branch=main
