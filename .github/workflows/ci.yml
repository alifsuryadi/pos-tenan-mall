name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tes dan build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Jalankan tes
        run: npm test

      - name: Periksa tipe dan build
        run: npm run build
        env:
          # Hanya staging yang memuat data dan PIN contoh.
          VITE_DEMO_DATA: ${{ github.ref_name == 'dev' && 'true' || 'false' }}

      # dev menghasilkan paket staging, main menghasilkan paket produksi.
      - name: Simpan hasil build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: pos-${{ github.ref_name == 'main' && 'production' || 'staging' }}-${{ github.sha }}
          path: dist
          retention-days: 14
          if-no-files-found: error

  docker:
    name: Build image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t pos-tenan-mall:ci .

      - name: Jalankan dan periksa image
        run: bash docker/smoke-test.sh pos-tenan-mall:ci

  deploy-staging:
    name: Deploy staging
    needs: verify
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    # Bagian environment yang membuat deploy tercatat di panel Deployments GitHub.
    environment:
      name: staging
      url: https://dev.pos-tenan-mall.pages.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Periksa secret Cloudflare
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy staging dilewati karena secret Cloudflare belum dipasang."
          fi

      - name: Ambil hasil build
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pos-staging-${{ github.sha }}
          path: dist

      - name: Kirim ke Cloudflare Pages
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages deploy dist --project-name=pos-tenan-mall --branch=dev

  merge-direction:
    name: Periksa arah merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Hanya dev, release/* dan hotfix/* yang boleh masuk ke main.
      - name: Tolak PR ke main dari branch lain
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && ! [[ "$HEAD" == "dev" || "$HEAD" == release/* || "$HEAD" == hotfix/* ]]; then
            echo "::error::Branch $HEAD harus masuk ke dev dulu. Hanya dev, release/* dan hotfix/* yang boleh masuk ke main."
            exit 1
          fi
